<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#151b24">
  <title>Vendor Docket · Procurement trial desk</title>
</head>
<body>
<header class="mast">
  <a class="brand" href="./"><span class="mark" aria-hidden="true">V</span> Vendor Docket</a>
  <p>STABLE STUDIONET</p>
  <button id="wallet" type="button">Test wallets</button>
</header>
<main>
  <section class="intro">
    <div class="kicker">PROCUREMENT / SUPPLIER TRIALS</div>
    <h1>Issue a trial.<br><em>Verify the supplier.</em></h1>
    <p>Invite one supplier to a pilot order. GenLayer checks the GLEIF record before the invited wallet can claim the work order.</p>
    <a class="source" href="https://www.gleif.org/en/lei-data/access-and-use-lei-data/gleif-api" target="_blank" rel="noreferrer">GLEIF data source ↗</a>
  </section>
  <section class="desk" aria-label="Docket workspace">
    <aside class="queue">
      <div class="queueHead"><h2>Trial register</h2><button id="open" type="button">New trial</button></div>
      <div id="trials"></div>
      <button id="newest" type="button" hidden>Newest trials</button>
      <button id="older" type="button" hidden>Older trials</button>
    </aside>
    <article id="detail" class="detail"></article>
  </section>
  <p id="notice" role="status"></p>
  <section id="evidence" class="evidence" aria-label="Recorded testnet transactions"></section>
</main>
<dialog id="dialog"><form id="actionForm"><h2 id="dialogTitle"></h2><div id="fields"></div><p id="signingContext"></p><div class="buttons"><button value="cancel" type="button" id="cancel">Cancel</button><button type="submit" class="primary" id="confirm">Confirm</button></div></form></dialog>
<script type="module" src="/src.mjs"></script>
</body>
</html>
